name: Stable Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Build installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:win

      - name: Extract changelog for this version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag -replace '^v', ''
          $content = Get-Content CHANGELOG.md -Raw
          if ($content -match "(?s)## $ver[\s\S]*?(?=## |\Z)") {
            $matches[0].Trim() | Out-File -FilePath release-notes.md -Encoding utf8
          } else {
            "See the changelog at https://github.com/HKHOP/jigsaw-agent/blob/main/CHANGELOG.md" | Out-File -FilePath release-notes.md -Encoding utf8
          }

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          body_path: release-notes.md
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
